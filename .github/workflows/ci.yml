name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect E2E-relevant changes
    runs-on: ubuntu-latest
    outputs:
      quality: ${{ steps.filter.outputs.quality }}
      unit: ${{ steps.filter.outputs.unit }}
      e2e: ${{ steps.filter.outputs.e2e }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Detect E2E-relevant changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            quality:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - '.github/workflows/ci.yml'
            unit:
              - 'cmd/**'
              - 'internal/**'
              - 'go.mod'
              - 'go.sum'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            e2e:
              - 'cmd/**'
              - 'internal/**'
              - 'tests/e2e/**'
              - 'go.mod'
              - 'go.sum'
              - 'Makefile'
              - '.github/workflows/ci.yml'

  quality:
    name: Format and module checks
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.quality == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: git ls-files -z '*.go' | xargs -0 gofmt -l | (! grep -q .)

      - name: Verify module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  unit-tests:
    name: Unit tests
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.unit == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run unit tests
        run: make test-unit

  e2e-tests:
    name: End-to-end smoke test
    needs: [changes, quality]
    if: >-
      always() && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.e2e == 'true') &&
      needs.quality.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build CLI
        run: make build

      - name: Verify CLI startup
        run: ./bin/mezha --help
